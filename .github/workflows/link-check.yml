name: Link Check

on:
  push:
    branches: [main]
    paths: ['data/daily/manifest.json']
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (비우면 오늘 KST)'
        required: false

permissions:
  contents: write

concurrency:
  group: linkcheck
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check URLs (flag only, never blocks publishing)
        env:
          GSB_API_KEY: ${{ secrets.GSB_API_KEY }}
          IN_DATE: ${{ github.event.inputs.date }}
        run: |
          D="${IN_DATE:-$(TZ=Asia/Seoul date +%F)}"
          [ -f "data/daily/$D.json" ] || { echo "no data for $D"; exit 0; }
          python3 tools/linkcheck.py "data/daily/$D.json" "data/linkcheck/$D.json"
          git config user.name "threatprism-bot"; git config user.email "threatprism-bot@users.noreply.github.com"
          git add data/linkcheck
          git diff --cached --quiet && exit 0
          git commit -m "Link check $D"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
